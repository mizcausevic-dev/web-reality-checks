<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ht hd">
<title id="ht">Break it on purpose</title>
<desc id="hd">Title card with a node:test output panel from episode 15. The known-positive control line is highlighted: the flaw must be observable or the fix test proves nothing.</desc>
<style>.f{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.m{font-family:'DejaVu Sans Mono','Courier New',monospace}</style>
<rect width="1600" height="900" fill="#0b0c10"/>
<rect x="0" y="0" width="1600" height="900" fill="url(#g)"/>
<defs><radialGradient id="g" cx="0.72" cy="0.35" r="0.75"><stop offset="0" stop-color="#171a21" stop-opacity="0.9"/><stop offset="1" stop-color="#0b0c10" stop-opacity="0"/></radialGradient></defs>
<text x="96" y="132" class="f" font-size="22" font-weight="700" letter-spacing="5" fill="#3dd6f5">WEB REALITY CHECKS · FOR ENGINEERS</text>
<text x="92" y="300" class="f" font-size="124" font-weight="800" letter-spacing="-4" fill="#f3ede3">Break it</text>
<text x="92" y="430" class="f" font-size="124" font-weight="800" letter-spacing="-4" fill="#f3ede3">on purpose.</text>
<text x="96" y="506" class="f" font-size="32" font-weight="500" fill="#9a978f">Prove your bug test can fail</text>
<text x="96" y="548" class="f" font-size="32" font-weight="500" fill="#9a978f">before you trust it passing.</text>
<g class="f" font-size="24" font-weight="700">
<rect x="96" y="660" width="140" height="56" rx="14" fill="#171a21" stroke="#f5533d" stroke-width="2.5"/><text x="166" y="696" text-anchor="middle" fill="#f5533d">Flaw</text>
<path d="M244 688 H262" stroke="#5e5c57" stroke-width="3" stroke-linecap="round"/>
<rect x="270" y="660" width="170" height="56" rx="14" fill="#171a21" stroke="#f5b63d" stroke-width="2.5"/><text x="355" y="696" text-anchor="middle" fill="#f5b63d">Control</text>
<path d="M448 688 H466" stroke="#5e5c57" stroke-width="3" stroke-linecap="round"/>
<rect x="474" y="660" width="150" height="56" rx="14" fill="#171a21" stroke="#3dd6f5" stroke-width="2.5"/><text x="549" y="696" text-anchor="middle" fill="#3dd6f5">Repair</text>
<path d="M632 688 H650" stroke="#5e5c57" stroke-width="3" stroke-linecap="round"/>
<rect x="658" y="660" width="150" height="56" rx="14" fill="#171a21" stroke="#5fe08a" stroke-width="2.5"/><text x="733" y="696" text-anchor="middle" fill="#5fe08a">Retest</text>
</g>
<text x="96" y="810" class="f" font-size="24" fill="#5e5c57">Miz Causevic, Kinetic Gain LLC · local synthetic fixtures · node --test</text>
<!-- terminal panel -->
<rect x="850" y="150" width="660" height="590" rx="22" fill="#171a21" stroke="#2a2e38" stroke-width="2"/>
<circle cx="890" cy="192" r="8" fill="#f5533d" opacity="0.7"/><circle cx="916" cy="192" r="8" fill="#f5b63d" opacity="0.7"/><circle cx="942" cy="192" r="8" fill="#5fe08a" opacity="0.7"/>
<text x="970" y="199" class="m" font-size="17" fill="#9a978f">node --test fixtures/ep15-idempotency/test.mjs</text>
<line x1="850" y1="226" x2="1510" y2="226" stroke="#2a2e38"/>
<g class="m" font-size="21">
<text x="886" y="278" fill="#5fe08a">✔ unauthenticated POST is rejected</text>
<text x="912" y="310" fill="#5fe08a">on both endpoints</text>
<rect x="866" y="344" width="628" height="118" rx="12" fill="#f5b63d" fill-opacity="0.14" stroke="#f5b63d" stroke-width="2.5"/>
<text x="886" y="384" fill="#f5b63d">✔ KNOWN-POSITIVE CONTROL: lost</text>
<text x="912" y="416" fill="#f5b63d">response + retry on the vulnerable</text>
<text x="912" y="448" fill="#f5b63d">endpoint creates TWO orders</text>
<text x="886" y="516" fill="#5fe08a">✔ corrected endpoint: lost response +</text>
<text x="912" y="548" fill="#5fe08a">retry, same key, creates ONE order</text>
<text x="886" y="598" fill="#5fe08a">✔ same key, different request -> 422</text>
<text x="886" y="648" fill="#f3ede3">ℹ tests 13   pass 13   fail 0</text>
</g>
<text x="1180" y="704" text-anchor="middle" class="f" font-size="21" font-weight="600" fill="#f5b63d">“the flaw must be observable or the fix test proves nothing”</text>
</svg>
