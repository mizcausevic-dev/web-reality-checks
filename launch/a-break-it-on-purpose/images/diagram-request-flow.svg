<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" role="img" aria-labelledby="t d">
<title id="t">Request flow in the episode 15 fixture</title><desc id="d">Sequence: the client sends POST /orders with an Idempotency-Key. The server scopes the key to the session user and operation and commits the order and key record in one transaction. A fault header destroys the socket before the response. The retry with the same key is answered from the stored record with Idempotent-Replayed true.</desc>
<style>.f{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.m{font-family:'DejaVu Sans Mono','Courier New',monospace}</style>
<rect width="1600" height="960" fill="#0b0c10"/><defs><marker id="a3dd6f5" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#3dd6f5"/></marker><marker id="af5b63d" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#f5b63d"/></marker><marker id="af5533d" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#f5533d"/></marker><marker id="a5fe08a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#5fe08a"/></marker><marker id="a5e5c57" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#5e5c57"/></marker><marker id="aa78bfa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#a78bfa"/></marker><marker id="a9a978f" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#9a978f"/></marker></defs>
<text x="68" y="92" class="f" font-size="22" font-weight="700" fill="#3dd6f5" text-anchor="start" letter-spacing="4">REQUEST FLOW FROM A REAL FIXTURE</text>
<text x="68" y="140" class="f" font-size="34" font-weight="700" fill="#f3ede3" text-anchor="start">Where the guarantee lives: a UNIQUE constraint, not an if statement</text>
<rect x="75.0" y="190" width="250" height="70" rx="16" fill="#171a21" stroke="#3dd6f5" stroke-width="2.5"/>
<text x="200" y="233" class="f" font-size="24" font-weight="700" fill="#3dd6f5" text-anchor="middle" letter-spacing="3">CLIENT</text>
<rect x="430.0" y="190" width="300" height="70" rx="16" fill="#171a21" stroke="#3dd6f5" stroke-width="2.5"/>
<text x="580" y="233" class="f" font-size="24" font-weight="700" fill="#3dd6f5" text-anchor="middle" letter-spacing="3">SERVICE</text>
<rect x="835.0" y="190" width="250" height="70" rx="16" fill="#171a21" stroke="#5fe08a" stroke-width="2.5"/>
<text x="960" y="233" class="f" font-size="24" font-weight="700" fill="#5fe08a" text-anchor="middle" letter-spacing="3">SQLITE</text>
<text x="580" y="284" class="m" font-size="20" font-weight="500" fill="#9a978f" text-anchor="middle">server.mjs</text>
<text x="960" y="284" class="m" font-size="20" font-weight="500" fill="#9a978f" text-anchor="middle">db.mjs</text>
<text x="200" y="284" class="m" font-size="20" font-weight="500" fill="#9a978f" text-anchor="middle">test client</text>
<line x1="200" y1="300" x2="200" y2="900" stroke="#2a2e38" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8"/>
<line x1="580" y1="300" x2="580" y2="900" stroke="#2a2e38" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8"/>
<line x1="960" y1="300" x2="960" y2="900" stroke="#2a2e38" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8"/>
<rect x="68" y="312" width="1464" height="36" rx="0" fill="#0b0c10" stroke="#0b0c10" stroke-width="0"/>
<text x="68" y="330" class="f" font-size="20" font-weight="700" fill="#f5b63d" text-anchor="start" letter-spacing="3">ATTEMPT 1</text>
<line x1="200" y1="366" x2="576" y2="366" stroke="#3dd6f5" stroke-width="3" stroke-linecap="round" marker-end="url(#a3dd6f5)"/>
<text x="390.0" y="354" class="f" font-size="19" font-weight="600" fill="#3dd6f5" text-anchor="middle">POST /orders + key ck_7f3a…</text>
<line x1="580" y1="420" x2="956" y2="420" stroke="#3dd6f5" stroke-width="3" stroke-linecap="round" marker-end="url(#a3dd6f5)"/>
<text x="770.0" y="408" class="f" font-size="19" font-weight="600" fill="#3dd6f5" text-anchor="middle">one transaction: order + key</text>
<rect x="840" y="438" width="240" height="64" rx="12" fill="#0b0c10" stroke="#5fe08a" stroke-width="2"/>
<text x="960" y="466" class="m" font-size="22" font-weight="700" fill="#5fe08a" text-anchor="middle">COMMIT</text>
<text x="960" y="490" class="m" font-size="17" font-weight="500" fill="#9a978f" text-anchor="middle">UNIQUE(user,op,key)</text>
<line x1="960" y1="522" x2="584" y2="522" stroke="#5fe08a" stroke-width="3" stroke-linecap="round" marker-end="url(#a5fe08a)"/>
<text x="770.0" y="510" class="f" font-size="19" font-weight="600" fill="#5fe08a" text-anchor="middle">committed</text>
<line x1="580" y1="574" x2="230" y2="574" stroke="#f5533d" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#af5533d)"/>
<text x="400.0" y="562" class="f" font-size="19" font-weight="600" fill="#f5533d" text-anchor="middle">X-Fault: lose-response</text>
<rect x="70" y="586" width="260" height="68" rx="12" fill="#0b0c10" stroke="#f5533d" stroke-width="2"/>
<text x="200" y="614" class="m" font-size="20" font-weight="700" fill="#f5533d" text-anchor="middle">UND_ERR_SOCKET</text>
<text x="200" y="640" class="f" font-size="18" font-weight="500" fill="#9a978f" text-anchor="middle">did the commit happen?</text>
<text x="68" y="700" class="f" font-size="20" font-weight="700" fill="#f5b63d" text-anchor="start" letter-spacing="3">ATTEMPT 2 · SAME KEY · SAME FINGERPRINT</text>
<line x1="200" y1="760" x2="576" y2="760" stroke="#f5b63d" stroke-width="3" stroke-linecap="round" marker-end="url(#af5b63d)"/>
<text x="390.0" y="748" class="f" font-size="19" font-weight="600" fill="#f5b63d" text-anchor="middle">POST /orders  same key</text>
<line x1="580" y1="804" x2="956" y2="804" stroke="#f5b63d" stroke-width="3" stroke-linecap="round" marker-end="url(#af5b63d)"/>
<text x="770.0" y="792" class="f" font-size="19" font-weight="600" fill="#f5b63d" text-anchor="middle">key found, fingerprint ok</text>
<line x1="960" y1="848" x2="584" y2="848" stroke="#5fe08a" stroke-width="3" stroke-linecap="round" marker-end="url(#a5fe08a)"/>
<text x="770.0" y="836" class="f" font-size="19" font-weight="600" fill="#5fe08a" text-anchor="middle">stored result</text>
<line x1="580" y1="892" x2="204" y2="892" stroke="#5fe08a" stroke-width="3" stroke-linecap="round" marker-end="url(#a5fe08a)"/>
<text x="390.0" y="880" class="f" font-size="19" font-weight="600" fill="#5fe08a" text-anchor="middle">201 · Idempotent-Replayed: true</text>
<rect x="1420" y="330" width="132" height="0.1" rx="0" fill="#0b0c10" stroke="#0b0c10" stroke-width="0"/>
<rect x="1130" y="330" width="420" height="150" rx="16" fill="#171a21" stroke="#2a2e38" stroke-width="2"/>
<text x="1152" y="366.0" class="f" font-size="20" font-weight="500" fill="#9a978f" text-anchor="start">Check-then-insert would race:</text>
<text x="1152" y="393.0" class="f" font-size="20" font-weight="500" fill="#9a978f" text-anchor="start">two requests both read</text>
<text x="1152" y="420.0" class="f" font-size="20" font-weight="500" fill="#9a978f" text-anchor="start">“no record” and both insert.</text>
<text x="1152" y="447.0" class="f" font-size="20" font-weight="500" fill="#9a978f" text-anchor="start">The UNIQUE constraint is atomic.</text>
<rect x="1130" y="640" width="420" height="200" rx="16" fill="#171a21" stroke="#5fe08a" stroke-width="2"/>
<text x="1152" y="680" class="f" font-size="20" font-weight="700" fill="#5fe08a" text-anchor="start" letter-spacing="1">Result (evidence.json)</text>
<text x="1152" y="718.0" class="f" font-size="21" font-weight="600" fill="#f3ede3" text-anchor="start">2 attempts → 1 order</text>
<text x="1152" y="747.4" class="f" font-size="21" font-weight="600" fill="#f3ede3" text-anchor="start">Same key, qty 1→3: 422</text>
<text x="1152" y="776.8" class="f" font-size="21" font-weight="600" fill="#f3ede3" text-anchor="start">5 concurrent, 1 key:</text>
<text x="1152" y="806.2" class="f" font-size="21" font-weight="600" fill="#f3ede3" text-anchor="start">1 order</text>
<text x="68" y="930" class="f" font-size="19" font-weight="500" fill="#5e5c57" text-anchor="start">Local synthetic fixture. The socket destroy is a controlled fault, not a real network partition. Source: fixtures/ep15-idempotency/{server,db}.mjs.</text>
</svg>
