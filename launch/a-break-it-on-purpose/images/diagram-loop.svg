<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Flaw, Control, Repair, Retest with episode 15 filled in</title><desc id="d">Four panels. Flaw: a lost response and a retry create two orders. Control: a test that asserts the flaw is observable. Repair: an idempotency key, a unique constraint and one transaction. Retest: the same scenario creates one order and the suite reports 13 pass, 0 fail.</desc>
<style>.f{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.m{font-family:'DejaVu Sans Mono','Courier New',monospace}</style>
<rect width="1600" height="900" fill="#0b0c10"/><defs><marker id="a3dd6f5" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#3dd6f5"/></marker><marker id="af5b63d" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#f5b63d"/></marker><marker id="af5533d" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#f5533d"/></marker><marker id="a5fe08a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#5fe08a"/></marker><marker id="a5e5c57" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#5e5c57"/></marker><marker id="aa78bfa" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#a78bfa"/></marker><marker id="a9a978f" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#9a978f"/></marker></defs>
<text x="68" y="92" class="f" font-size="22" font-weight="700" fill="#3dd6f5" text-anchor="start" letter-spacing="4">THE METHOD, WITH EPISODE 15 FILLED IN</text>
<text x="68" y="140" class="f" font-size="34" font-weight="700" fill="#f3ede3" text-anchor="start">Same schedule before and after. Only the code under test changes.</text>
<rect x="68" y="190" width="336" height="520" rx="20" fill="#171a21" stroke="#f5533d" stroke-width="2.5"/>
<circle cx="112" cy="238" r="22" fill="#0b0c10" stroke="#f5533d" stroke-width="2.5"/>
<text x="112" y="246" class="f" font-size="22" font-weight="800" fill="#f5533d" text-anchor="middle">1</text>
<text x="150" y="247" class="f" font-size="30" font-weight="800" fill="#f3ede3" text-anchor="start">Flaw</text>
<line x1="410" y1="450.0" x2="438" y2="450.0" stroke="#5e5c57" stroke-width="3" stroke-linecap="round" marker-end="url(#a5e5c57)"/>
<rect x="444" y="190" width="336" height="520" rx="20" fill="#171a21" stroke="#f5b63d" stroke-width="2.5"/>
<circle cx="488" cy="238" r="22" fill="#0b0c10" stroke="#f5b63d" stroke-width="2.5"/>
<text x="488" y="246" class="f" font-size="22" font-weight="800" fill="#f5b63d" text-anchor="middle">2</text>
<text x="526" y="247" class="f" font-size="30" font-weight="800" fill="#f3ede3" text-anchor="start">Control</text>
<line x1="786" y1="450.0" x2="814" y2="450.0" stroke="#5e5c57" stroke-width="3" stroke-linecap="round" marker-end="url(#a5e5c57)"/>
<rect x="820" y="190" width="336" height="520" rx="20" fill="#171a21" stroke="#3dd6f5" stroke-width="2.5"/>
<circle cx="864" cy="238" r="22" fill="#0b0c10" stroke="#3dd6f5" stroke-width="2.5"/>
<text x="864" y="246" class="f" font-size="22" font-weight="800" fill="#3dd6f5" text-anchor="middle">3</text>
<text x="902" y="247" class="f" font-size="30" font-weight="800" fill="#f3ede3" text-anchor="start">Repair</text>
<line x1="1162" y1="450.0" x2="1190" y2="450.0" stroke="#5e5c57" stroke-width="3" stroke-linecap="round" marker-end="url(#a5e5c57)"/>
<rect x="1196" y="190" width="336" height="520" rx="20" fill="#171a21" stroke="#5fe08a" stroke-width="2.5"/>
<circle cx="1240" cy="238" r="22" fill="#0b0c10" stroke="#5fe08a" stroke-width="2.5"/>
<text x="1240" y="246" class="f" font-size="22" font-weight="800" fill="#5fe08a" text-anchor="middle">4</text>
<text x="1278" y="247" class="f" font-size="30" font-weight="800" fill="#f3ede3" text-anchor="start">Retest</text>
<text x="92" y="302.0" class="f" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">One tap on Pay. The server</text>
<text x="92" y="331.4" class="f" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">commits order 1, then the</text>
<text x="92" y="360.8" class="f" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">response is lost. The client</text>
<text x="92" y="390.2" class="f" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">retries.</text>
<rect x="92" y="422" width="288" height="56" rx="12" fill="#0b0c10" stroke="#2a2e38" stroke-width="2"/>
<text x="108" y="458" class="m" font-size="20" font-weight="600" fill="#f3ede3" text-anchor="start">POST /vuln/orders</text>
<text x="236.0" y="580" class="f" font-size="92" font-weight="800" fill="#f5533d" text-anchor="middle">2 → 2</text>
<text x="236.0" y="622" class="f" font-size="20" font-weight="700" fill="#9a978f" text-anchor="middle" letter-spacing="2">ATTEMPTS → ORDERS</text>
<text x="92" y="678" class="f" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">No memory of attempt 1.</text>
<text x="468" y="302.0" class="f" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">A test that proves the bug</text>
<text x="468" y="331.4" class="f" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">is visible. If it cannot</text>
<text x="468" y="360.8" class="f" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">fail on the flawed code, the</text>
<text x="468" y="390.2" class="f" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">fix test proves nothing.</text>
<rect x="468" y="422" width="288" height="150" rx="12" fill="#0b0c10" stroke="#f5b63d" stroke-width="2"/>
<text x="482" y="456.0" class="m" font-size="17" font-weight="600" fill="#f5b63d" text-anchor="start">KNOWN-POSITIVE</text>
<text x="482" y="479.46" class="m" font-size="17" font-weight="600" fill="#f5b63d" text-anchor="start">CONTROL: lost</text>
<text x="482" y="502.92" class="m" font-size="17" font-weight="600" fill="#f5b63d" text-anchor="start">response + retry on</text>
<text x="482" y="526.38" class="m" font-size="17" font-weight="600" fill="#f5b63d" text-anchor="start">the vulnerable endpoint</text>
<text x="482" y="549.84" class="m" font-size="17" font-weight="600" fill="#f5b63d" text-anchor="start">creates TWO orders</text>
<rect x="468" y="586" width="288" height="64" rx="12" fill="#0b0c10" stroke="#2a2e38" stroke-width="2"/>
<text x="482" y="612" class="m" font-size="17" font-weight="500" fill="#f3ede3" text-anchor="start">assert.equal(</text>
<text x="482" y="636" class="m" font-size="17" font-weight="500" fill="#f3ede3" text-anchor="start">count('u_alice'), 2)</text>
<text x="468" y="686" class="f" font-size="21" font-weight="600" fill="#f5b63d" text-anchor="start">Passes only if the flaw is real.</text>
<text x="844" y="302.0" class="f" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">The smallest repair, with</text>
<text x="844" y="331.4" class="f" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">its limits stated.</text>
<rect x="844" y="366" width="288" height="220" rx="12" fill="#0b0c10" stroke="#2a2e38" stroke-width="2"/>
<text x="858" y="400" class="m" font-size="17" font-weight="600" fill="#3dd6f5" text-anchor="start">Idempotency-Key</text>
<text x="878" y="427" class="m" font-size="17" font-weight="600" fill="#3dd6f5" text-anchor="start">per attempt</text>
<text x="858" y="454" class="m" font-size="17" font-weight="600" fill="#3dd6f5" text-anchor="start">Scoped to session user</text>
<text x="858" y="481" class="m" font-size="17" font-weight="600" fill="#3dd6f5" text-anchor="start">UNIQUE (user_id,</text>
<text x="878" y="508" class="m" font-size="17" font-weight="600" fill="#3dd6f5" text-anchor="start">operation, key)</text>
<text x="858" y="535" class="m" font-size="17" font-weight="600" fill="#3dd6f5" text-anchor="start">Order + key row in</text>
<text x="878" y="562" class="m" font-size="17" font-weight="600" fill="#3dd6f5" text-anchor="start">ONE transaction</text>
<text x="844" y="628.0" class="f" font-size="20" font-weight="500" fill="#9a978f" text-anchor="start">Limit: the transaction does</text>
<text x="844" y="656.0" class="f" font-size="20" font-weight="500" fill="#9a978f" text-anchor="start">not cover an external</text>
<text x="844" y="684.0" class="f" font-size="20" font-weight="500" fill="#9a978f" text-anchor="start">payment provider.</text>
<text x="1220" y="302.0" class="f" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">Same scenario: commit,</text>
<text x="1220" y="331.4" class="f" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">lose the response, retry</text>
<text x="1220" y="360.8" class="f" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">with the same key.</text>
<text x="1364.0" y="450" class="f" font-size="92" font-weight="800" fill="#5fe08a" text-anchor="middle">2 → 1</text>
<text x="1364.0" y="492" class="f" font-size="20" font-weight="700" fill="#9a978f" text-anchor="middle" letter-spacing="2">ATTEMPTS → ORDERS</text>
<rect x="1220" y="522" width="288" height="60" rx="12" fill="#0b0c10" stroke="#2a2e38" stroke-width="2"/>
<text x="1234" y="560" class="m" font-size="19" font-weight="600" fill="#f3ede3" text-anchor="start">same key, qty 1→3: 422</text>
<rect x="1220" y="600" width="288" height="60" rx="12" fill="#0b0c10" stroke="#5fe08a" stroke-width="2"/>
<text x="1234" y="638" class="m" font-size="20" font-weight="700" fill="#5fe08a" text-anchor="start"># pass 13   # fail 0</text>
<text x="68" y="780" class="f" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">Source: fixtures/ep15-idempotency/evidence.json and test.mjs. Local synthetic fixture, loopback only, no payment provider.</text>
<text x="68" y="822" class="f" font-size="21" font-weight="500" fill="#5e5c57" text-anchor="start">The lost response is a controlled server-side socket destroy, not a real network partition.</text>
</svg>
