<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Diagram: the Flaw, Control, Repair, Retest loop filled in with Episode 15"><title>Diagram: the Flaw, Control, Repair, Retest loop filled in with Episode 15</title><rect width="1600" height="900" fill="#0b0c10"/><text x="60" y="84" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="800" fill="#f3ede3" text-anchor="start" letter-spacing="-1">Flaw → Control → Repair → Retest, with Episode 15 filled in</text><text x="60" y="124" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="500" fill="#9a978f" text-anchor="start">You clicked Pay once. Why did the app create two orders? Synthetic order service on loopback; values from evidence.json.</text><rect x="40" y="170" width="355" height="640" rx="18" fill="#171a21" stroke="#f5533d" stroke-width="3"/><text x="68" y="222" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f5533d" text-anchor="start" letter-spacing="3">1  FLAW</text><text x="68" y="272" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#f3ede3" text-anchor="start">Lost response, then</text><text x="68" y="308" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#f3ede3" text-anchor="start">retry</text><rect x="64" y="370" width="307" height="148" rx="12" fill="#0d0f14" stroke="#2a2e38" stroke-width="2"/><text x="80" y="414" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="17" font-weight="500" fill="#f3ede3" text-anchor="start">attempt 1: socket closed</text><text x="80" y="450" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="17" font-weight="500" fill="#f3ede3" text-anchor="start">(server had committed)</text><text x="80" y="486" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="17" font-weight="500" fill="#f3ede3" text-anchor="start">attempt 2: 201 created</text><text x="68" y="590" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="800" fill="#f5533d" text-anchor="start">2 attempts → 2</text><text x="68" y="630" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="800" fill="#f5533d" text-anchor="start">orders</text><text x="68" y="690" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">The server has no memory</text><text x="68" y="718" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">that the retry is the same</text><text x="68" y="746" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">intention.</text><line x1="398" y1="490" x2="423" y2="490" stroke="#9a978f" stroke-width="4" stroke-linecap="round"/><path d="M423 490 l-14 -9 l0 18 z" fill="#9a978f" transform="rotate(0 423 490) translate(0 0)"/><rect x="425" y="170" width="355" height="640" rx="18" fill="#171a21" stroke="#f5b63d" stroke-width="3"/><text x="453" y="222" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f5b63d" text-anchor="start" letter-spacing="3">2  CONTROL</text><text x="453" y="272" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#f3ede3" text-anchor="start">A test that proves the</text><text x="453" y="308" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#f3ede3" text-anchor="start">flaw is catchable</text><rect x="449" y="370" width="307" height="148" rx="12" fill="#0d0f14" stroke="#2a2e38" stroke-width="2"/><text x="465" y="414" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="17" font-weight="500" fill="#f3ede3" text-anchor="start">assert: vulnerable</text><text x="465" y="450" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="17" font-weight="500" fill="#f3ede3" text-anchor="start">endpoint makes 2 orders</text><text x="465" y="486" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="17" font-weight="500" fill="#f3ede3" text-anchor="start">after lost response+retry</text><text x="453" y="590" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="800" fill="#f5b63d" text-anchor="start">Known-positive</text><text x="453" y="630" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="800" fill="#f5b63d" text-anchor="start">control</text><text x="453" y="690" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">If this test ever saw one</text><text x="453" y="718" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">order, the test would be</text><text x="453" y="746" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">broken, not the bug fixed.</text><line x1="783" y1="490" x2="808" y2="490" stroke="#9a978f" stroke-width="4" stroke-linecap="round"/><path d="M808 490 l-14 -9 l0 18 z" fill="#9a978f" transform="rotate(0 808 490) translate(0 0)"/><rect x="810" y="170" width="355" height="640" rx="18" fill="#171a21" stroke="#3dd6f5" stroke-width="3"/><text x="838" y="222" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#3dd6f5" text-anchor="start" letter-spacing="3">3  REPAIR</text><text x="838" y="272" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#f3ede3" text-anchor="start">The smallest fix, with</text><text x="838" y="308" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#f3ede3" text-anchor="start">limits</text><rect x="834" y="370" width="307" height="148" rx="12" fill="#0d0f14" stroke="#2a2e38" stroke-width="2"/><text x="850" y="414" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="17" font-weight="500" fill="#f3ede3" text-anchor="start">Idempotency-Key header</text><text x="850" y="450" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="17" font-weight="500" fill="#f3ede3" text-anchor="start">UNIQUE(user, op, key)</text><text x="850" y="486" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="17" font-weight="500" fill="#f3ede3" text-anchor="start">order+key: 1 transaction</text><text x="838" y="590" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="800" fill="#3dd6f5" text-anchor="start">Same key replays</text><text x="838" y="630" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="800" fill="#3dd6f5" text-anchor="start">the result</text><text x="838" y="690" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">Not exactly-once delivery</text><text x="838" y="718" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">across systems. Retention</text><text x="838" y="746" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">is a separate decision.</text><line x1="1168" y1="490" x2="1193" y2="490" stroke="#9a978f" stroke-width="4" stroke-linecap="round"/><path d="M1193 490 l-14 -9 l0 18 z" fill="#9a978f" transform="rotate(0 1193 490) translate(0 0)"/><rect x="1195" y="170" width="355" height="640" rx="18" fill="#171a21" stroke="#5fe08a" stroke-width="3"/><text x="1223" y="222" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#5fe08a" text-anchor="start" letter-spacing="3">4  RETEST</text><text x="1223" y="272" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#f3ede3" text-anchor="start">Same schedule, real</text><text x="1223" y="308" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#f3ede3" text-anchor="start">numbers</text><rect x="1219" y="370" width="307" height="148" rx="12" fill="#0d0f14" stroke="#2a2e38" stroke-width="2"/><text x="1235" y="414" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="17" font-weight="500" fill="#f3ede3" text-anchor="start">lost response + retry</text><text x="1235" y="450" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="17" font-weight="500" fill="#f3ede3" text-anchor="start">-&gt; 2 attempts, 1 order</text><text x="1235" y="486" font-family="'DejaVu Sans Mono', ui-monospace, monospace" font-size="17" font-weight="500" fill="#f3ede3" text-anchor="start">qty 1-&gt;3, same key: 422</text><text x="1223" y="590" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="800" fill="#5fe08a" text-anchor="start">5 concurrent → 1</text><text x="1223" y="630" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="800" fill="#5fe08a" text-anchor="start">order</text><text x="1223" y="690" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">Passes for this endpoint</text><text x="1223" y="718" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">only. Other write paths</text><text x="1223" y="746" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">need the same test.</text><text x="60" y="860" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">Sources: fixtures/ep15-idempotency/evidence.json and test.mjs. Local synthetic fixture; no payment provider is contacted.</text></svg>