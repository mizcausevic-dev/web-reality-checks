<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-label="Diagram: ten launch questions mapped to five arcs of Web Reality Checks"><title>Diagram: ten launch questions mapped to five arcs of Web Reality Checks</title><rect width="1600" height="1010" fill="#0b0c10"/><text x="60" y="84" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="800" fill="#f3ede3" text-anchor="start" letter-spacing="-1">Ten launch questions, five arcs</text><text x="60" y="124" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="500" fill="#9a978f" text-anchor="start">Each question maps to episodes whose fixtures and tests are in the repository. Episode numbers on each card.</text><rect x="60" y="160" width="1480" height="146" rx="18" fill="#12141a" stroke="#2a2e38" stroke-width="2"/><rect x="60" y="160" width="10" height="146" rx="5" fill="#f5533d"/><text x="96" y="222" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#f5533d" text-anchor="start">Trust &amp;</text><text x="96" y="260" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#f5533d" text-anchor="start">access</text><rect x="400" y="176" width="550" height="114" rx="18" fill="#171a21" stroke="#f5533d" stroke-width="2"/><circle cx="440" cy="216" r="24" fill="#f5533d30"/><text x="440" y="225" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f5533d" text-anchor="middle">1</text><text x="480" y="212" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">Can one customer read another</text><text x="480" y="243" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">customer's data?</text><text x="480" y="274" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#9a978f" text-anchor="start" letter-spacing="2">EPISODES  01 · 24</text><rect x="980" y="176" width="550" height="114" rx="18" fill="#171a21" stroke="#f5533d" stroke-width="2"/><circle cx="1020" cy="216" r="24" fill="#f5533d30"/><text x="1020" y="225" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f5533d" text-anchor="middle">2</text><text x="1060" y="212" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">What does the server enforce</text><text x="1060" y="243" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">when the UI hides it?</text><text x="1060" y="274" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#9a978f" text-anchor="start" letter-spacing="2">EPISODES  03 · 28 · 29</text><rect x="60" y="326" width="1480" height="146" rx="18" fill="#12141a" stroke="#2a2e38" stroke-width="2"/><rect x="60" y="326" width="10" height="146" rx="5" fill="#f5b63d"/><text x="96" y="388" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#f5b63d" text-anchor="start">Duplicates &amp;</text><text x="96" y="426" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#f5b63d" text-anchor="start">ordering</text><rect x="400" y="342" width="550" height="114" rx="18" fill="#171a21" stroke="#f5b63d" stroke-width="2"/><circle cx="440" cy="382" r="24" fill="#f5b63d30"/><text x="440" y="391" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f5b63d" text-anchor="middle">3</text><text x="480" y="378" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">If a request is retried, what</text><text x="480" y="409" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">runs twice?</text><text x="480" y="440" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#9a978f" text-anchor="start" letter-spacing="2">EPISODES  15 · 02 · 30</text><rect x="980" y="342" width="550" height="114" rx="18" fill="#171a21" stroke="#f5b63d" stroke-width="2"/><circle cx="1020" cy="382" r="24" fill="#f5b63d30"/><text x="1020" y="391" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f5b63d" text-anchor="middle">4</text><text x="1060" y="378" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">What if a message arrives</text><text x="1060" y="409" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">twice, or late?</text><text x="1060" y="440" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#9a978f" text-anchor="start" letter-spacing="2">EPISODES  18 · 23 · 27</text><rect x="60" y="492" width="1480" height="146" rx="18" fill="#12141a" stroke="#2a2e38" stroke-width="2"/><rect x="60" y="492" width="10" height="146" rx="5" fill="#3dd6f5"/><text x="96" y="554" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#3dd6f5" text-anchor="start">Data lifecycle</text><rect x="400" y="508" width="550" height="114" rx="18" fill="#171a21" stroke="#3dd6f5" stroke-width="2"/><circle cx="440" cy="548" r="24" fill="#3dd6f530"/><text x="440" y="557" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#3dd6f5" text-anchor="middle">5</text><text x="480" y="544" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">When we delete it, where do the</text><text x="480" y="575" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">copies live?</text><text x="480" y="606" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#9a978f" text-anchor="start" letter-spacing="2">EPISODES  21 · 04</text><rect x="980" y="508" width="550" height="114" rx="18" fill="#171a21" stroke="#3dd6f5" stroke-width="2"/><circle cx="1020" cy="548" r="24" fill="#3dd6f530"/><text x="1020" y="557" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#3dd6f5" text-anchor="middle">6</text><text x="1060" y="544" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">Who checked the number, and was</text><text x="1060" y="575" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">the backup restored?</text><text x="1060" y="606" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#9a978f" text-anchor="start" letter-spacing="2">EPISODES  05 · 25</text><rect x="60" y="658" width="1480" height="146" rx="18" fill="#12141a" stroke="#2a2e38" stroke-width="2"/><rect x="60" y="658" width="10" height="146" rx="5" fill="#5fe08a"/><text x="96" y="720" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#5fe08a" text-anchor="start">Delivery &amp;</text><text x="96" y="758" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#5fe08a" text-anchor="start">freshness</text><rect x="400" y="674" width="550" height="114" rx="18" fill="#171a21" stroke="#5fe08a" stroke-width="2"/><circle cx="440" cy="714" r="24" fill="#5fe08a30"/><text x="440" y="723" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#5fe08a" text-anchor="middle">7</text><text x="480" y="710" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">After we ship, who still sees</text><text x="480" y="741" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">the old version?</text><text x="480" y="772" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#9a978f" text-anchor="start" letter-spacing="2">EPISODES  12 · 07 · 10</text><rect x="980" y="674" width="550" height="114" rx="18" fill="#171a21" stroke="#5fe08a" stroke-width="2"/><circle cx="1020" cy="714" r="24" fill="#5fe08a30"/><text x="1020" y="723" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#5fe08a" text-anchor="middle">8</text><text x="1060" y="710" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">How old is the data behind the</text><text x="1060" y="741" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">word Live?</text><text x="1060" y="772" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#9a978f" text-anchor="start" letter-spacing="2">EPISODES  17 · 19</text><rect x="60" y="824" width="1480" height="146" rx="18" fill="#12141a" stroke="#2a2e38" stroke-width="2"/><rect x="60" y="824" width="10" height="146" rx="5" fill="#a78bfa"/><text x="96" y="886" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#a78bfa" text-anchor="start">Experience &amp;</text><text x="96" y="924" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" fill="#a78bfa" text-anchor="start">speed</text><rect x="400" y="840" width="550" height="114" rx="18" fill="#171a21" stroke="#a78bfa" stroke-width="2"/><circle cx="440" cy="880" r="24" fill="#a78bfa30"/><text x="440" y="889" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#a78bfa" text-anchor="middle">9</text><text x="480" y="876" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">Fast at loading, or fast at</text><text x="480" y="907" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">responding?</text><text x="480" y="938" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#9a978f" text-anchor="start" letter-spacing="2">EPISODES  08 · 16</text><rect x="980" y="840" width="550" height="114" rx="18" fill="#171a21" stroke="#a78bfa" stroke-width="2"/><circle cx="1020" cy="880" r="24" fill="#a78bfa30"/><text x="1020" y="889" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#a78bfa" text-anchor="middle">10</text><text x="1060" y="876" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">What happens when the user says</text><text x="1060" y="907" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600" fill="#f3ede3" text-anchor="start">no, or has no mouse?</text><text x="1060" y="938" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#9a978f" text-anchor="start" letter-spacing="2">EPISODES  11 · 09</text></svg>