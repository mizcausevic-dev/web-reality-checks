<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970" role="img" aria-label="Diagram: the evidence ladder and three launch decisions"><title>Diagram: the evidence ladder and three launch decisions</title><rect width="1600" height="970" fill="#0b0c10"/><text x="60" y="84" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="800" fill="#f3ede3" text-anchor="start" letter-spacing="-1">The evidence ladder</text><text x="60" y="124" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="500" fill="#9a978f" text-anchor="start">Climb as far as the risk requires. A question answered only by a demo is still unanswered.</text><rect x="50" y="430" width="280" height="210" rx="18" fill="#171a21" stroke="#f5533d" stroke-width="3"/><circle cx="90" cy="476" r="22" fill="#f5533d30"/><text x="90" y="484" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f5533d" text-anchor="middle">1</text><text x="74" y="538" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#f3ede3" text-anchor="start">Seen in a demo</text><text x="74" y="584" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">Works for one user on</text><text x="74" y="612" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">the happy path.</text><rect x="350" y="384" width="280" height="256" rx="18" fill="#171a21" stroke="#f5b63d" stroke-width="3"/><circle cx="390" cy="430" r="22" fill="#f5b63d30"/><text x="390" y="438" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f5b63d" text-anchor="middle">2</text><text x="374" y="492" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#f3ede3" text-anchor="start">Described in a</text><text x="374" y="526" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#f3ede3" text-anchor="start">document</text><text x="374" y="572" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">Someone intends the</text><text x="374" y="600" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">behavior.</text><rect x="650" y="338" width="280" height="302" rx="18" fill="#171a21" stroke="#f5b63d" stroke-width="3"/><circle cx="690" cy="384" r="22" fill="#f5b63d30"/><text x="690" y="392" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f5b63d" text-anchor="middle">3</text><text x="674" y="446" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#f3ede3" text-anchor="start">A test exists</text><text x="674" y="492" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">A check runs. It may be</text><text x="674" y="520" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">checking the wrong</text><text x="674" y="548" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">thing.</text><rect x="950" y="292" width="280" height="348" rx="18" fill="#171a21" stroke="#3dd6f5" stroke-width="3"/><circle cx="990" cy="338" r="22" fill="#3dd6f530"/><text x="990" y="346" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#3dd6f5" text-anchor="middle">4</text><text x="974" y="400" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#f3ede3" text-anchor="start">The test can</text><text x="974" y="434" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#f3ede3" text-anchor="start">fail</text><text x="974" y="480" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">A known-positive</text><text x="974" y="508" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">control shows the flaw</text><text x="974" y="536" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">is catchable.</text><rect x="1250" y="246" width="280" height="394" rx="18" fill="#171a21" stroke="#5fe08a" stroke-width="3"/><circle cx="1290" cy="292" r="22" fill="#5fe08a30"/><text x="1290" y="300" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#5fe08a" text-anchor="middle">5</text><text x="1274" y="354" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#f3ede3" text-anchor="start">Retested after</text><text x="1274" y="388" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#f3ede3" text-anchor="start">repair</text><text x="1274" y="434" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">Same test, same</text><text x="1274" y="462" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">schedule, real numbers.</text><text x="1274" y="490" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">Scope stated.</text><rect x="50" y="690" width="490" height="190" rx="18" fill="#171a21" stroke="#f5533d" stroke-width="3"/><text x="78" y="738" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f5533d" text-anchor="start" letter-spacing="3">HOLD</text><text x="78" y="780" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="500" fill="#f3ede3" text-anchor="start">Rungs 1 to 2 on anything that</text><text x="78" y="812" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="500" fill="#f3ede3" text-anchor="start">touches identity, money or customer</text><text x="78" y="844" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="500" fill="#f3ede3" text-anchor="start">data. Unknown is not safe.</text><rect x="560" y="690" width="490" height="190" rx="18" fill="#171a21" stroke="#f5b63d" stroke-width="3"/><text x="588" y="738" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#f5b63d" text-anchor="start" letter-spacing="3">GO WITH A NAMED RISK</text><text x="588" y="780" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="500" fill="#f3ede3" text-anchor="start">Rung 3 plus an owner, a date and a</text><text x="588" y="812" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="500" fill="#f3ede3" text-anchor="start">fallback written down.</text><rect x="1070" y="690" width="490" height="190" rx="18" fill="#171a21" stroke="#5fe08a" stroke-width="3"/><text x="1098" y="738" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800" fill="#5fe08a" text-anchor="start" letter-spacing="3">GO FOR THE TESTED SCOPE</text><text x="1098" y="780" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="500" fill="#f3ede3" text-anchor="start">Rungs 4 to 5 for the flaw</text><text x="1098" y="812" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="500" fill="#f3ede3" text-anchor="start">demonstrated. Limits written down.</text><text x="60" y="928" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start">A passing retest shows one demonstrated flaw is repaired in the tested scope. It does not show the product is secure.</text></svg>