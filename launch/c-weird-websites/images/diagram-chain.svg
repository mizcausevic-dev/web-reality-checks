x="72" y="314" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >what you see now</text><rect x="361" y="220" width="252" height="150" rx="20" fill="#171a21" stroke="#3dd6f5" stroke-width="3"/><text x="385" y="276" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="800" fill="#f3ede3" text-anchor="start" >Browser helper</text><text x="385" y="314" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >keeps a saved copy</text><text x="385" y="342" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >of the site</text><rect x="674" y="220" width="252" height="150" rx="20" fill="#171a21" stroke="#3dd6f5" stroke-width="3"/><text x="698" y="276" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="800" fill="#f3ede3" text-anchor="start" >Server</text><text x="698" y="314" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >answers requests</text><rect x="987" y="220" width="252" height="150" rx="20" fill="#171a21" stroke="#f5b63d" stroke-width="3"/><text x="1011" y="276" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="800" fill="#f3ede3" text-anchor="start" >Saved copies</text><text x="1011" y="314" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >caches and the</text><text x="1011" y="342" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >search list</text><rect x="1300" y="220" width="252" height="150" rx="20" fill="#171a21" stroke="#5fe08a" stroke-width="3"/><text x="1324" y="276" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="800" fill="#f3ede3" text-anchor="start" >Filing cabinet</text><text x="1324" y="314" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >the official</text><text x="1324" y="342" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >records</text><line x1="308" y1="270" x2="353" y2="270" stroke="#3dd6f5" stroke-width="4" stroke-linecap="round" marker-end="url(#a-3dd6f5)"/><line x1="353" y1="324" x2="308" y2="324" stroke="#9a978f" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#a-9a978f)"/><line x1="621" y1="270" x2="666" y2="270" stroke="#3dd6f5" stroke-width="4" stroke-linecap="round" marker-end="url(#a-3dd6f5)"/><line x1="666" y1="324" x2="621" y2="324" stroke="#9a978f" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#a-9a978f)"/><line x1="934" y1="270" x2="979" y2="270" stroke="#3dd6f5" stroke-width="4" stroke-linecap="round" marker-end="url(#a-3dd6f5)"/><line x1="979" y1="324" x2="934" y2="324" stroke="#9a978f" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#a-9a978f)"/><line x1="1247" y1="270" x2="1292" y2="270" stroke="#3dd6f5" stroke-width="4" stroke-linecap="round" marker-end="url(#a-3dd6f5)"/><line x1="1292" y1="324" x2="1247" y2="324" stroke="#9a978f" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#a-9a978f)"/><text x="48" y="184" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >Question travels right (solid). Answer travels back (dashed). Any helper may answer from its own copy.</text><rect x="48" y="470" width="272" height="300" rx="20" fill="#171a21" stroke="#3dd6f5" stroke-width="3"/><rect x="70" y="492" width="150" height="34" rx="17" fill="#3dd6f522" stroke="#3dd6f5" stroke-width="2"/><text x="145" y="516" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f3ede3" text-anchor="middle" >Episode 22</text><text x="70" y="568" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#f3ede3" text-anchor="start" >Date off by one</text><text x="70" y="606" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >A calendar date was</text><text x="70" y="636" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >turned into a</text><text x="70" y="666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >moment, then shown</text><text x="70" y="696" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >on your clock.</text><text x="70" y="746" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#3dd6f5" text-anchor="start" >birthday vs flight</text><path d="M184.0 470 V420 H174.0 V374" fill="none" stroke="#3dd6f5" stroke-width="3" stroke-dasharray="4 6" opacity="0.9"/><rect x="356" y="470" width="272" height="300" rx="20" fill="#171a21" stroke="#f5b63d" stroke-width="3"/><rect x="378" y="492" width="150" height="34" rx="17" fill="#f5b63d22" stroke="#f5b63d" stroke-width="2"/><text x="453" y="516" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f3ede3" text-anchor="middle" >Episode 12</text><text x="378" y="568" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#f3ede3" text-anchor="start" >The old page</text><text x="378" y="606" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >The helper keeps</text><text x="378" y="636" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >serving its copy</text><text x="378" y="666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >until the new one</text><text x="378" y="696" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >may take over.</text><text x="378" y="746" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#f5b63d" text-anchor="start" >manager at the door</text><path d="M492.0 470 V420 H487.0 V374" fill="none" stroke="#f5b63d" stroke-width="3" stroke-dasharray="4 6" opacity="0.9"/><rect x="664" y="470" width="272" height="300" rx="20" fill="#171a21" stroke="#f5533d" stroke-width="3"/><rect x="686" y="492" width="150" height="34" rx="17" fill="#f5533d22" stroke="#f5533d" stroke-width="2"/><text x="761" y="516" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f3ede3" text-anchor="middle" >Episode 15</text><text x="686" y="568" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#f3ede3" text-anchor="start" >Charged twice</text><text x="686" y="606" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >The reply got lost,</text><text x="686" y="636" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >so the retry looked</text><text x="686" y="666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >like a new order.</text><text x="686" y="746" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#f5533d" text-anchor="start" >dropped pizza call</text><path d="M800.0 470 V420 H800.0 V374" fill="none" stroke="#f5533d" stroke-width="3" stroke-dasharray="4 6" opacity="0.9"/><rect x="972" y="470" width="272" height="300" rx="20" fill="#171a21" stroke="#a78bfa" stroke-width="3"/><rect x="994" y="492" width="150" height="34" rx="17" fill="#a78bfa22" stroke="#a78bfa" stroke-width="2"/><text x="1069" y="516" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f3ede3" text-anchor="middle" >Episode 24</text><text x="994" y="568" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#f3ede3" text-anchor="start" >Wrong name</text><text x="994" y="606" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >One saved page was</text><text x="994" y="636" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >handed to everyone.</text><text x="994" y="746" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#a78bfa" text-anchor="start" >one welcome letter</text><path d="M1108.0 470 V420 H1053.0 V374" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="4 6" opacity="0.9"/><rect x="1280" y="470" width="272" height="300" rx="20" fill="#171a21" stroke="#5fe08a" stroke-width="3"/><rect x="1302" y="492" width="150" height="34" rx="17" fill="#5fe08a22" stroke="#5fe08a" stroke-width="2"/><text x="1377" y="516" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f3ede3" text-anchor="middle" >Episode 21</text><text x="1302" y="568" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="800" fill="#f3ede3" text-anchor="start" >Not really gone</text><text x="1302" y="606" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >The record was</text><text x="1302" y="636" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >deleted but its</text><text x="1302" y="666" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="500" fill="#9a978f" text-anchor="start" >copies were not.</text><text x="1302" y="746" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#5fe08a" text-anchor="start" >card in the drawer</text><path d="M1416.0 470 V420 H1173.0 V374" fill="none" stroke="#5fe08a" stroke-width="3" stroke-dasharray="4 6" opacity="0.9"/><text x="48" y="860" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="500" fill="#9a978f" text-anchor="start" >Source: fixtures ep12, ep15, ep21, ep22, ep24 in the Web Reality Checks repository. Local synthetic fixtures. Conceptual map, not product output.</text></svg>