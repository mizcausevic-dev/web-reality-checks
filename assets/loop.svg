<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 190" width="520" height="190" role="img" aria-labelledby="lt ld">
<title id="lt">Flaw, control, repair, retest</title><desc id="ld">Four linked steps: flaw in red, control in amber, repair in cyan, retest in green.</desc>
<defs><linearGradient id="fl" x1="0" x2="1"><stop offset="0" stop-color="#f5533d"/><stop offset=".35" stop-color="#f5b63d"/><stop offset=".7" stop-color="#3dd6f5"/><stop offset="1" stop-color="#5fe08a"/></linearGradient></defs>
<style>.f{font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif}.flow{stroke-dasharray:10 14;animation:dash 1.6s linear infinite}@keyframes dash{to{stroke-dashoffset:-48}}.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}.d1{animation-delay:.3s}.d2{animation-delay:.6s}.d3{animation-delay:.9s}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<path class="flow" d="M104 64 H126 M234 64 H256 M364 64 H386" stroke="url(#fl)" stroke-width="4" fill="none" stroke-linecap="round" transform="translate(-16 0)"/>
<g transform="translate(4 20)"><g class="pulse d0"><rect width="88" height="88" rx="18" fill="#171a21" stroke="#f5533d" stroke-width="3"/></g><text x="44" y="58" text-anchor="middle" class="f" font-size="36" font-weight="800" fill="#f5533d">✕</text><text x="44" y="136" text-anchor="middle" class="f" font-size="14" font-weight="700" letter-spacing="2" fill="#f3ede3">FLAW</text></g>
<g transform="translate(134 20)"><g class="pulse d1"><rect width="88" height="88" rx="18" fill="#171a21" stroke="#f5b63d" stroke-width="3"/></g><text x="44" y="58" text-anchor="middle" class="f" font-size="36" font-weight="800" fill="#f5b63d">?</text><text x="44" y="136" text-anchor="middle" class="f" font-size="14" font-weight="700" letter-spacing="2" fill="#f3ede3">CONTROL</text></g>
<g transform="translate(264 20)"><g class="pulse d2"><rect width="88" height="88" rx="18" fill="#171a21" stroke="#3dd6f5" stroke-width="3"/></g><text x="44" y="58" text-anchor="middle" class="f" font-size="36" font-weight="800" fill="#3dd6f5">→</text><text x="44" y="136" text-anchor="middle" class="f" font-size="14" font-weight="700" letter-spacing="2" fill="#f3ede3">REPAIR</text></g>
<g transform="translate(394 20)"><g class="pulse d3"><rect width="88" height="88" rx="18" fill="#171a21" stroke="#5fe08a" stroke-width="3"/></g><text x="44" y="58" text-anchor="middle" class="f" font-size="36" font-weight="800" fill="#5fe08a">✓</text><text x="44" y="136" text-anchor="middle" class="f" font-size="14" font-weight="700" letter-spacing="2" fill="#f3ede3">RETEST</text></g>
</svg>