<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img" aria-labelledby="pt pd">
<title id="pt">The Web Reality Checks method</title><desc id="pd">Four steps: reproduce the flaw, prove the test can fail with a known-positive control, apply the repair, retest with the same schedule.</desc>
<style>.f{font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif}.flow{stroke-dasharray:8 12;animation:dash 1.8s linear infinite}@keyframes dash{to{stroke-dashoffset:-40}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
<rect width="1280" height="280" rx="22" fill="#12141a" stroke="#2a2e38"/>
<g transform="translate(36 36)"><rect width="268" height="208" rx="18" fill="#171a21" stroke="#f5533d" stroke-width="2.5"/><circle cx="40" cy="44" r="22" fill="#0b0c10" stroke="#f5533d" stroke-width="2.5"/><text x="40" y="52" text-anchor="middle" class="f" font-size="22" font-weight="800" fill="#f5533d">1</text><text x="76" y="52" class="f" font-size="28" font-weight="800" fill="#f3ede3">Flaw</text><text x="24" y="108" class="f" font-size="19" fill="#9a978f">Reproduce the failure on a</text><text x="24" y="136" class="f" font-size="19" fill="#9a978f">local, synthetic fixture.</text></g><path class="flow" d="M308 140 H340" stroke="#5e5c57" stroke-width="3" stroke-linecap="round"/>
<g transform="translate(344 36)"><rect width="268" height="208" rx="18" fill="#171a21" stroke="#f5b63d" stroke-width="2.5"/><circle cx="40" cy="44" r="22" fill="#0b0c10" stroke="#f5b63d" stroke-width="2.5"/><text x="40" y="52" text-anchor="middle" class="f" font-size="22" font-weight="800" fill="#f5b63d">2</text><text x="76" y="52" class="f" font-size="28" font-weight="800" fill="#f3ede3">Control</text><text x="24" y="108" class="f" font-size="19" fill="#9a978f">A known-positive test</text><text x="24" y="136" class="f" font-size="19" fill="#9a978f">proves the detector can</text><text x="24" y="164" class="f" font-size="19" fill="#9a978f">fail.</text></g><path class="flow" d="M616 140 H648" stroke="#5e5c57" stroke-width="3" stroke-linecap="round"/>
<g transform="translate(652 36)"><rect width="268" height="208" rx="18" fill="#171a21" stroke="#3dd6f5" stroke-width="2.5"/><circle cx="40" cy="44" r="22" fill="#0b0c10" stroke="#3dd6f5" stroke-width="2.5"/><text x="40" y="52" text-anchor="middle" class="f" font-size="22" font-weight="800" fill="#3dd6f5">3</text><text x="76" y="52" class="f" font-size="28" font-weight="800" fill="#f3ede3">Repair</text><text x="24" y="108" class="f" font-size="19" fill="#9a978f">The smallest fix, with its</text><text x="24" y="136" class="f" font-size="19" fill="#9a978f">limits stated.</text></g><path class="flow" d="M924 140 H956" stroke="#5e5c57" stroke-width="3" stroke-linecap="round"/>
<g transform="translate(960 36)"><rect width="268" height="208" rx="18" fill="#171a21" stroke="#5fe08a" stroke-width="2.5"/><circle cx="40" cy="44" r="22" fill="#0b0c10" stroke="#5fe08a" stroke-width="2.5"/><text x="40" y="52" text-anchor="middle" class="f" font-size="22" font-weight="800" fill="#5fe08a">4</text><text x="76" y="52" class="f" font-size="28" font-weight="800" fill="#f3ede3">Retest</text><text x="24" y="108" class="f" font-size="19" fill="#9a978f">Same test, same schedule,</text><text x="24" y="136" class="f" font-size="19" fill="#9a978f">real results on screen.</text></g>
</svg>