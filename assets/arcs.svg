<g class="fade" style="animation-delay:0s" transform="translate(22 22)"><rect width="236" height="336" rx="16" fill="#171a21" stroke="#2a2e38"/><rect width="236" height="6" rx="3" fill="#f5533d"/><text x="16" y="38" class="f" font-size="17" font-weight="800" fill="#f5533d">Trust &amp; access</text><text x="16" y="72" class="f" font-size="15" fill="#5e5c57" font-weight="700">01</text><text x="46" y="72" class="f" font-size="15" fill="#f3ede3">Is it safe to launch?</text><text x="16" y="114" class="f" font-size="15" fill="#5e5c57" font-weight="700">03</text><text x="46" y="114" class="f" font-size="15" fill="#f3ede3">What Sign In does</text><text x="16" y="156" class="f" font-size="15" fill="#5e5c57" font-weight="700">13</text><text x="46" y="156" class="f" font-size="15" fill="#f3ede3">Is that key a leak?</text><text x="16" y="198" class="f" font-size="15" fill="#5e5c57" font-weight="700">24</text><text x="46" y="198" class="f" font-size="15" fill="#f3ede3">Someone else's name</text><text x="16" y="240" class="f" font-size="15" fill="#5e5c57" font-weight="700">28</text><text x="46" y="240" class="f" font-size="15" fill="#f3ede3">Hidden is not denied</text><text x="16" y="282" class="f" font-size="15" fill="#5e5c57" font-weight="700">29</text><text x="46" y="282" class="f" font-size="15" fill="#f3ede3">ep29</text></g>
