<g class="fade" style="animation-delay:0.2s" transform="translate(518 22)"><rect width="236" height="336" rx="16" fill="#171a21" stroke="#2a2e38"/><rect width="236" height="6" rx="3" fill="#3dd6f5"/><text x="16" y="38" class="f" font-size="17" font-weight="800" fill="#3dd6f5">Data lifecycle</text><text x="16" y="72" class="f" font-size="15" fill="#5e5c57" font-weight="700">04</text><text x="46" y="72" class="f" font-size="15" fill="#f3ede3">A database in the page</text><text x="16" y="114" class="f" font-size="15" fill="#5e5c57" font-weight="700">05</text><text x="46" y="114" class="f" font-size="15" fill="#f3ede3">How many are wrong?</text><text x="16" y="156" class="f" font-size="15" fill="#5e5c57" font-weight="700">21</text><text x="46" y="156" class="f" font-size="15" fill="#f3ede3">Episode 21</text><text x="16" y="198" class="f" font-size="15" fill="#5e5c57" font-weight="700">22</text><text x="46" y="198" class="f" font-size="15" fill="#f3ede3">Dates moved back a day</text><text x="16" y="240" class="f" font-size="15" fill="#5e5c57" font-weight="700">25</text><text x="46" y="240" class="f" font-size="15" fill="#f3ede3">Can you restore it?</text><text x="16" y="282" class="f" font-size="15" fill="#5e5c57" font-weight="700">26</text><text x="46" y="282" class="f" font-size="15" fill="#f3ede3">One page, 101 queries</text></g>
