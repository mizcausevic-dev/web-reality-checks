<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="t d">
<title id="t">Web Reality Checks</title><desc id="d">27 short technical films, each backed by a runnable local fixture and regression tests. Flaw, control, repair, retest.</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c10"/><stop offset="1" stop-color="#101a22"/></linearGradient>
<linearGradient id="fl" x1="0" x2="1"><stop offset="0" stop-color="#f5533d"/><stop offset=".35" stop-color="#f5b63d"/><stop offset=".7" stop-color="#3dd6f5"/><stop offset="1" stop-color="#5fe08a"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#171a21" stroke-width="1"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.f{font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif}.m{font-family:ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace}
.flow{stroke-dasharray:10 14;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-48}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.18);opacity:1}}
.d1{animation-delay:.3s}.d2{animation-delay:.6s}.d3{animation-delay:.9s}.d4{animation-delay:1.2s}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect width="1280" height="380" rx="24" fill="url(#g)"/><rect width="1280" height="380" rx="24" fill="url(#grid)" opacity=".55"/>
<rect x="1" y="1" width="1278" height="378" rx="23" fill="none" stroke="#2a2e38"/>
<text x="64" y="86" class="f" font-size="16" font-weight="700" letter-spacing="6" fill="#3dd6f5">WEB REALITY CHECKS</text>
<text x="64" y="156" class="f" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#f3ede3">Break it on purpose.</text>
<text x="64" y="222" class="f" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#f3ede3">Prove the fix.</text>
<text x="64" y="272" class="f" font-size="20" fill="#9a978f">27 short technical films. Each one backed by a runnable local fixture,</text>
<text x="64" y="300" class="f" font-size="20" fill="#9a978f">regression tests, narration, captions and a plain-language write-up.</text>
<g class="m" font-size="14" fill="#5e5c57"><text x="64" y="342">synthetic data · loopback only · every on-screen number comes from evidence.json</text></g>
<g transform="translate(760 120)">
 <path class="flow" d="M84 40 H124 M214 40 H254 M344 40 H384" stroke="url(#fl)" stroke-width="4" fill="none" stroke-linecap="round"/>
 <g class="pulse"><rect x="0" y="0" width="80" height="80" rx="16" fill="#171a21" stroke="#f5533d" stroke-width="3" filter="url(#glow)"/></g>
 <text x="40" y="52" text-anchor="middle" class="f" font-size="32" font-weight="800" fill="#f5533d">✕</text>
 <text x="40" y="116" text-anchor="middle" class="f" font-size="14" font-weight="700" letter-spacing="2" fill="#f3ede3">FLAW</text>
 <g class="pulse d1"><rect x="130" y="0" width="80" height="80" rx="16" fill="#171a21" stroke="#f5b63d" stroke-width="3"/></g>
 <text x="170" y="54" text-anchor="middle" class="f" font-size="34" font-weight="800" fill="#f5b63d">?</text>
 <text x="170" y="116" text-anchor="middle" class="f" font-size="14" font-weight="700" letter-spacing="2" fill="#f3ede3">CONTROL</text>
 <g class="pulse d2"><rect x="260" y="0" width="80" height="80" rx="16" fill="#171a21" stroke="#3dd6f5" stroke-width="3"/></g>
 <text x="300" y="54" text-anchor="middle" class="f" font-size="30" font-weight="800" fill="#3dd6f5">→</text>
 <text x="300" y="116" text-anchor="middle" class="f" font-size="14" font-weight="700" letter-spacing="2" fill="#f3ede3">REPAIR</text>
 <g class="pulse d3"><rect x="390" y="0" width="80" height="80" rx="16" fill="#171a21" stroke="#5fe08a" stroke-width="3"/></g>
 <text x="430" y="54" text-anchor="middle" class="f" font-size="32" font-weight="800" fill="#5fe08a">✓</text>
 <text x="430" y="116" text-anchor="middle" class="f" font-size="14" font-weight="700" letter-spacing="2" fill="#f3ede3">RETEST</text>
</g>
</svg>